# ─────────────────────────────────────────────────────────────────────────
# Langfuse self-host (BONUS Atelier 07) — version 2 (compatible SDK langfuse==2.57.1)
#
# Le chemin par DÉFAUT en formation est Langfuse Cloud (https://cloud.langfuse.com,
# déjà câblé en AT05) : zéro install, plus simple en salle.
# Ce compose est un BONUS pour qui veut tout en local (souveraineté des données).
#
# Langfuse v2 = 2 conteneurs seulement (serveur + Postgres), bien plus léger que la
# v3 (6 conteneurs : web/worker/postgres/clickhouse/redis/minio).
#
# Lancer :
#   docker compose -f ateliers/atelier-07-observabilite/docker-compose.langfuse.yml up -d
# Puis ouvrir http://localhost:3000, créer un projet, copier les clés pk-lf-/sk-lf-
# dans .env :
#   LANGFUSE_HOST=http://localhost:3000
#   LANGFUSE_PUBLIC_KEY=pk-lf-...
#   LANGFUSE_SECRET_KEY=sk-lf-...
# Arrêter / nettoyer : docker compose -f <ce fichier> down -v
# ─────────────────────────────────────────────────────────────────────────
services:
  langfuse-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-server:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      # ⚠️ Secrets de DÉMO uniquement — régénère-les pour tout usage réel :
      #   openssl rand -hex 32
      NEXTAUTH_SECRET: demo-nextauth-secret-change-me
      SALT: demo-salt-change-me
      TELEMETRY_ENABLED: "false"

volumes:
  langfuse_pgdata:
